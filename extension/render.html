<!-- Pickax Post to Image — hidden-tab render page.

     the background opens this extension page in a hidden tab with the
     render request in the URL hash; render-page.js renders the PNG and
     either downloads it or sends the data URL back to the requesting tab,
     then closes its own tab. -->

  <head><meta charset="utf-8" /></head>
  <body>
    <script src="render-page.js"></script>
  </body>
</html>
