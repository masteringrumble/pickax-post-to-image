<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pickax Post to Image — Turn any Pickax post into a shareable image</title>
    <meta name="description" content="Paste a Pickax post link and get a clean, downloadable PNG image. Free, fast, no sign-up — the image is built right in your browser." />
    <link rel="canonical" href="https://masteringrumble.github.io/pickax-post-to-image/" />
    <meta name="theme-color" content="#0c101d" />

    <!-- Favicons / app branding -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />

    <!-- Open Graph: link previews on Facebook, LinkedIn, Reddit, Threads,
         Bluesky, Truth Social, Parler, GETTR, and other platforms -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pickax Post to Image" />
    <meta property="og:title" content="Pickax Post to Image — Turn any Pickax post into a shareable image" />
    <meta property="og:description" content="Paste a Pickax post link and get a clean, downloadable PNG. Free, fast, no sign-up." />
    <meta property="og:url" content="https://masteringrumble.github.io/pickax-post-to-image/" />
    <meta property="og:image" content="https://masteringrumble.github.io/pickax-post-to-image/og-image.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pickax Post to Image — paste a Pickax post link and get a clean shareable PNG image. Free, fast, no sign-up." />
    <meta property="og:locale" content="en_US" />

    <!-- X / Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pickax Post to Image — Turn any Pickax post into a shareable image" />
    <meta name="twitter:description" content="Paste a Pickax post link and get a clean, downloadable PNG. Free, fast, no sign-up." />
    <meta name="twitter:image" content="https://masteringrumble.github.io/pickax-post-to-image/og-image.png?v=2" />
    <meta name="twitter:image:alt" content="Pickax Post to Image — paste a Pickax post link and get a clean shareable PNG image. Free, fast, no sign-up." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- ShareThis: sticky share sidebar (shares this site). Official ShareThis embed script. -->
    <script type="text/javascript" src="https://platform-api.sharethis.com/js/sharethis.js" async></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- ShareThis sticky share buttons: floating sidebar sharing the tool site itself -->
    <div
      class="sharethis-share-buttons"
      data-type="sticky-share-buttons"
      data-url="https://masteringrumble.github.io/pickax-post-to-image/"
      data-title="Pickax Post to Image — Turn any Pickax post into a shareable image"
    >
      <span data-network="facebook"></span>
      <span data-network="x"></span>
      <span data-network="whatsapp"></span>
      <span data-network="telegram"></span>
      <span data-network="reddit"></span>
      <span data-network="linkedin"></span>
      <span data-network="pinterest-pin"></span>
      <span data-network="email"></span>
      <span data-network="sharethis"></span>
    </div>

    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
